# configs/newenv_vfinal.yaml — 09-29 11:30 사용자 확정 최종 무대 "vfinal": v6s 일정에 풍속 범위만 깔끔하게(약풍 0–3, 강풍 6–9).
#   ep1–60 약풍 U(0,3) → ep61–120 강풍 U(6,9) → ep121–200 섞임 U(0,9).
#   v6s(U(0,4) → U(6.5,9) → U(0,9))와 전환 시점이 같다 — Isaac 에서 전환이 ep61 일 때 SWIRL 의 전환 직후 우위가 선명했다(v6s 5/5).
#   공격·보상(v5)·패턴은 v6 그대로, scenario.wind.schedule 만 바꿈(코드 수정 없음). Isaac 은 configs/overlays/wind_vfinal.yaml.
extends: newenv_v6.yaml
run: {name: newenv_vfinal}
scenario:
  wind:
    mode: uniform
    range: [0.0, 3.0]
    schedule:
      - {from_ep: 60, mode: uniform, range: [6.0, 9.0]}
      - {from_ep: 120, mode: uniform, range: [0.0, 9.0]}
