# configs/isaac_v2_swirl.yaml — Isaac 본선(새 무대 v2) SWIRL 최종 설정. 실행: scripts/isaac_run.sh <out> --config configs/isaac_v2_swirl.yaml --config configs/overlays/isaac.yaml --set run.seed=42
extends: newenv_v2.yaml
run: {name: isaac_v2_swirl, outdir: results/claudecodefortest/isaac_v2/swirl_s42, seed: 42, episodes: 200, ep_steps: 300, device: cuda}
reward: {scale: 5.0}
agent:
  type: swirl
  batch: 256
  hidden: [24, 24]
  tau: 0.02
  update_interval: 4
  swirl: {R: 1.0, huber_c: 0, N: 6, act: target, argmax: spas}
log: {steps: true, eval_n: 0}
