# configs/newenv_v5.yaml — 확정 무대 v5 (09-22 사용자 결정)
#   공격: v2 의 burst + persistent(성장 유지: 약 ×1.8–2.2, 전이 ×1.3–1.5) 를 그대로 두고, 유효 δ 가 밴드 상한을 넘던 버그만 수정(delta_max 0.80 클립).
#         밴드는 09-21 결정대로 연속(0.15–0.30 / 0.30–0.70 / 0.70–0.80). v2 의 간극 밴드로 돌리려면 classes 의 delta 만 바꾸면 된다.
#   보상: (R₀, C_FP, C_FN, R_d) = (1, 1.5, 1.5, 4)·c1 — n14/n19 최선형(0.5·0.7·0.7·2 ×2). fn_onset_mult 1.8 은 전 무대 공통.
#   바람: U(0,7).  관측·행동·에피 길이는 v4 와 동일.
extends: newenv_v4.yaml
run: {name: newenv_v5}
scenario:
  attack:
    delta_max: 0.80
    classes:
      - {name: weak_burst,     weight: 0.175, delta: [0.15, 0.30], kind: burst,      dur: [4, 8]}
      - {name: weak_persist,   weight: 0.175, delta: [0.15, 0.30], kind: persistent, dur: [15, 30], grow: [1.8, 2.2], grow_steps: [3, 6]}
      - {name: trans_burst,    weight: 0.175, delta: [0.30, 0.70], kind: burst,      dur: [4, 8]}
      - {name: trans_persist,  weight: 0.175, delta: [0.30, 0.70], kind: persistent, dur: [15, 30], grow: [1.3, 1.5], grow_steps: [3, 6]}
      - {name: strong_burst,   weight: 0.15,  delta: [0.70, 0.80], kind: burst,      dur: [4, 8]}
      - {name: strong_persist, weight: 0.15,  delta: [0.70, 0.80], kind: persistent, dur: [25, 40]}
  wind: {mode: uniform, range: [0.0, 7.0]}
reward: {mode: cost, scale: 1.0, alive: 1.0, c_fa: 1.5, c_d: 1.5, bonus: 4.0, terminal_penalty: 0.0}
