# configs/isaac_v4_adam.yaml — Isaac 본선 v4 Adam(표준): 같은 무대·보상 정수안, lr 3e-4·β5·clip10·B256·[24,24]·ui1·τ0.005·He
extends: newenv_v4.yaml
run: {name: isaac_v4_adam, outdir: results/claudecodefortest/isaac_v4/adam_s42, seed: 42, episodes: 200, ep_steps: 300, device: cpu}
