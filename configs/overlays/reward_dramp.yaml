# configs/overlays/reward_dramp.yaml — 09-29 21:00 사용자: 증가형 미탐(지연) 비용 시험. 보상 오버레이(현행 또는 reward_kA1) 뒤에 얹는다.
#   c_d(d) = c_d · min(d, 6) / 3,  d = 온셋 뒤 몇 번째 공격 스텝(1부터).
#   기준 3 = 프레임워크 대응 데드라인(d≤3 전환이면 생존)에서 현행 상수 c_d 와 같고, 그보다 빠르면 싸고 늦으면 비싸다(상한 d=6 에서 2·c_d).
#   정규화: Isaac vfinal Adam 미탐 분포로 평균 배율 0.81(ep121–200)·1.15(전 에피) — 크기는 현행과 비슷, 모양만 다름.
reward:
  c_d_ref: 3.0
  c_d_cap: 6
