# configs/overlays/wind_vfinal.yaml — 09-29 11:30: Isaac 최종 무대 vfinal 바람 오버레이(= configs/newenv_vfinal.yaml 의 scenario.wind). isaac_v6s_*.yaml 뒤에 붙인다.
#   ep1–60 U(0,3) → ep61–120 U(6,9) → ep121–200 섞임 U(0,9).
scenario:
  wind:
    mode: uniform
    range: [0.0, 3.0]
    schedule:
    - {from_ep: 60, mode: uniform, range: [6.0, 9.0]}
    - {from_ep: 120, mode: uniform, range: [0.0, 9.0]}
