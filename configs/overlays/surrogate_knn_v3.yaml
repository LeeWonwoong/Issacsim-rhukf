# configs/overlays/surrogate_knn_v3.yaml — ★09-23 Isaac↔surrogate 정합 수정판.
#   v2 와 풀은 같고, 코드 수정(F1·F4·F5 는 무조건 적용)에 더해 설정 가능한 F3·F6·F7 을 켠다.
#
#   ── 진단으로 확정된 결함과 수정 (8-에이전트 워크플로 wf_12cd0b26-b05, 실측) ──
#   F1  `_iq` floor 인덱스 버그: i=int(u·(k−1)) 라 최상위 순서통계량이 영원히 안 뽑혔다.
#       재생분포가 '하위 k−1 개 위의 이산 균등' → 평균 −30%·분산 −73%·>p99 꼬리 6.7배 과소.
#       중점 보간으로 교체(코드, 항상 적용).
#   F4  사후 시계 포화 15→60: 공격 종료 16 스텝 뒤부터 '공격 이력 없는 평시'와 같은 질의점이 됐다.
#       Isaac 은 since 61–98 에서도 평시의 2.16 배이고 에피 끝까지 안 돌아온다.
#       홀드아웃 행의 15.3%(16,769)가 진짜 평시와 섞여 양쪽을 동시에 망쳤다(코드, 항상).
#   F5  dwell 포화 5→12: 행동→관측 되먹임이 5 스텝에서 잘려 정책이 상태분포를 못 움직였다
#       (hover 비율 0→0.2 일 때 평시 관측 이동 Isaac +0.228 vs surrogate +0.045).
#       이것이 'R·pΔ 를 바꿔도 같은 정책으로 수렴'의 지목된 1순위 원인이다(코드, 항상).
#   F3  에피소드 임의효과: Isaac 평시 gyro 분산의 42%(z 단위 55%)가 에피 단위 잠재변수
#       (COM 편향 추첨·바람 방향·초기 트림)인데 32 이웃이 서로 다른 에피에서 와 평균으로 날아갔다.
#       오프셋 십분위별 이웃범위 이탈률 0.017→0.492 완전 단조. z = m + AR(1), 주변분포 보존.
#   F6  채널별 ρ: 구 코드는 평시 ρ 를 풀 파일에서 읽어 설정 불가였고 공격 중은 두 채널이 같은 값이었다.
#   F7  사건 수준 랜덤효과(ICC 0.45 · 사건 총 z-SD 1.35, 실측): 공격 구간 실현 분산이 너무 좁았다.
#
#   ── 수정 후 강제 재생 실측 (Isaac 홀드아웃 390 에피, 같은 공격계획·같은 행동열) ──
#     평시 gyro ACF   lag1/5/10/40  Isaac .831/.651/.547/.334   수정전 .831/.506/.373/.240 → 수정후 .859/.658/.600/.435
#     평시 vel  ACF   lag1/5/10     Isaac .711/.562/.422        수정전 .455/.226/.128      → 수정후 .785/.377/.196
#     평시 sd 비(S/I) gyro 0.84 → 0.86,  vel 0.76 → 0.75
#     d′ 약/전이/강   Isaac 1.45/3.82/5.58   수정전 2.37/4.56/7.14 → 수정후 1.89/5.35/7.72
#
#   ⚠ 남은 격차(정직하게): 공격 구간 실현 sd 가 여전히 Isaac 의 0.6–0.8 배이고 d′ 가 1.3–1.4 배 높다.
#     뿌리는 풀의 공격 행 희소성(43,316 / 758,414 = 5.7%, 640 셀 전부 512 행 미만, 35–41%는 32 행 미만)이다.
#     코드로는 못 메운다 — 공격 밀도 높은 Isaac 캡처 400–600 에피가 필요하다(특히 강공격 중 track 은 2,572 행뿐).
#     따라서 **절대 성능(F1 값)은 여전히 Isaac 보다 낙관적**이다. 설정 간 순위·격차 판정용으로만 쓴다.
extends: surrogate_knn_v2.yaml
env:
  surrogate:
    knn_k: 256                 # P0-a. k=32 는 뽑을 수 있는 최상위 순서통계량이 이웃의 ~98 분위까지라
                               #   평시 raw p99(Isaac 145)·p99.9(310)가 원리적으로 안 나온다. d′ 격차의 큰 몫.
                               #   ⚠ _nn_cache 키에 k 가 없어 k 변경이 조용히 무시되던 버그도 같이 고쳤다.
    knn_ep_off_g: 0.6          # P0-b. 가산형(구 축소형은 에피내 분산을 25% 깎아 총분산을 Isaac 아래로 내렸다)
    knn_ep_off_v: 0.45
    knn_ep_off_corr: 0.461
    # P0-c. 평시 코퓰러 = 너겟 + 2성분 AR. 단일 AR(1) 로는 lag1 과 lag10 을 동시에 못 맞춘다.
    #   값은 (진폭_너겟, 진폭1, ρ1, 진폭2, ρ2). 진폭² = 분산 비중.
    #   gyro 분산비중 0.15/0.44/0.41 · vel 0.27/0.73 (실측 적합, 5 lag 오차 ≤0.01)
    knn_c2_g: [0.387, 0.663, 0.73, 0.640, 0.961]
    knn_c2_v: [0.520, 0.0,   0.0,  0.854, 0.930]
    # 공격 중: 사건 수준 랜덤효과(ICC 0.45). 채널 분리 가능하나 k=256 에서 1.0 이 실측에 가장 가깝다.
    knn_atk_sd: 1.0
    knn_ev_icc: 0.45
    knn_rho_g_atk: 0.92
    knn_rho_v_atk: 0.68

#   ── 최종 실측(Isaac 홀드아웃 390 에피 강제 1:1 재생, 로그의 delta_eff/atk_flag 로 plan 재구성) ──
#     지표                Isaac    수정전(노브OFF)   최종(k256·c2·가산)
#     평시 gyro 에피간 sd   0.705       0.484            0.537
#     gyro ACF lag5/10/20  .486/.358/.265  .297/.120/.052   .344/.196/.093
#     vel  ACF lag1/3/5    .835/.711/.587  .594/.424/.314   .758/.617/.474
#     평시 raw p99.9       309.9        172.0            206.3
#     d′ 약/전이/강        1.48/3.42/5.00  1.93/4.48/6.79   1.79/4.17/6.11
#   ⚠ 남은 격차: d′ 가 아직 1.2 배 높고 평시 꼬리가 Isaac 의 0.5~0.7 배다.
#     뿌리는 풀의 공격 행 희소성(43,316/758,414 = 5.7%, 조건 셀 35% 가 32 행 미만)이라 코드로는 못 고친다.
#     → 공격 밀집 Isaac 캡처 400 에피가 필요(P2-a). 그 전까지 절대 F1 은 낙관적이고,
#       R·pΔ·ui 같은 필터 내부 노브는 Isaac 으로 확인해야 한다.
