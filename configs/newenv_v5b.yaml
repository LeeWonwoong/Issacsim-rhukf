# configs/newenv_v5b.yaml — v5a 보다 한 단계 더: 가중 약 0.25 / 전이 0.45 / 강 0.30, 약 persistent 성장 2–4 스텝, 사건 간격 30–60 → 20–45 (에피 안 비정상성↑). 나머지 v5 동일.
extends: newenv_v5a.yaml
run: {name: newenv_v5b}
scenario:
  attack:
    event_gap: [20, 45]
    classes:
      - {name: weak_burst,     weight: 0.125, delta: [0.15, 0.30], kind: burst,      dur: [4, 8]}
      - {name: weak_persist,   weight: 0.125, delta: [0.15, 0.30], kind: persistent, dur: [15, 30], grow: [1.8, 2.2], grow_steps: [2, 4]}
      - {name: trans_burst,    weight: 0.225, delta: [0.30, 0.70], kind: burst,      dur: [4, 8]}
      - {name: trans_persist,  weight: 0.225, delta: [0.30, 0.70], kind: persistent, dur: [15, 30], grow: [1.3, 1.5], grow_steps: [3, 6]}
      - {name: strong_burst,   weight: 0.15,  delta: [0.70, 0.80], kind: burst,      dur: [4, 8]}
      - {name: strong_persist, weight: 0.15,  delta: [0.70, 0.80], kind: persistent, dur: [25, 40]}
