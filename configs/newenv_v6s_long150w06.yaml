# configs/newenv_v6s_long150w06.yaml — 09-29 01:45 사용자 질문 "약풍을 처음부터 0–6 으로 하는 것과 150–200 에만 넣는 것의 차이" 확인용 대조 무대(최종 무대 아님).
#   ep1–100 U(0,6) → ep101–150 U(6,9) → ep151–200 섞임 U(0,9). long150 과 약풍 범위만 다르다.
extends: newenv_v6.yaml
run: {name: newenv_v6s_long150w06}
scenario:
  wind:
    mode: uniform
    range: [0.0, 6.0]
    schedule:
      - {from_ep: 100, mode: uniform, range: [6.0, 9.0]}
      - {from_ep: 150, mode: uniform, range: [0.0, 9.0]}
