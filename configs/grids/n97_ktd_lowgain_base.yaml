# n97_ktd_lowgain_base — 09-28 16:55 EKF 진단(wf_0066af3c-08a): 칼만-TD 가 Adam 에 지는 원인 = 이득 과대(‖K‖≈√(q/R), Adam 흡수율의 6.5배 → θ 흔들림·Q 가파름·오경보).
#   처방 = 이득↓. EKF 는 huber0 에서 (q, p_init, R) 등변 → (q, p_init)/c 는 R=c 와 같은 필터(KOVA 의 R=배치 크기 계열). c ∈ {10, 100, 1000}.
#   선택값(EKF q1e-4·p0.5 / UKF q1e-4·p1)을 c 로 나눔. UKF 는 시그마점 폭이 P 에 달려 근사 등변. 나머지 = n96/n93 과 동일. 무대 v6s base, 시드 42–43 먼저.
