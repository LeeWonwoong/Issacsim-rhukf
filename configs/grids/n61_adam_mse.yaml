# n61 — 09-23 사용자 지시: surrogate 에서 Adam 손실을 Huber → MSE 로 바꿔 본다.
#   목적: Adam 의 과보수 임계(보정 믿음 0.818 vs p* 0.659)가 옵티마이저 탓인지 Huber β5 탓인지 가르기
#         (보너스 6 > β5 라 가장 큰 양의 TD 오차가 선형 구간에서 잘린다).
#   n60 의 Adam 기준선(a_a_wref1316)과 설정 동일, 손실만 바꾼다. grad_clip 10 은 유지(손실만 격리).
#   Huber 도 같이 돌린다: 시드 42·43 은 n60 재현 확인용(F1 0.438 / 0.506 이 나와야 함), 44–46 은 5 대 5 비교용.
#   CPU 전용(CUDA_VISIBLE_DEVICES 비움) — GPU 는 Isaac SWIRL 이 단독으로 쓴다. 런당 약 1분.
base: [configs/newenv_v5.yaml, configs/overlays/surrogate_knn_v3.yaml]
outdir: results/claudecodefortest/n61_adam_mse
seeds: [42, 43, 44, 45, 46]
stages: {a: {}}
learners:
  a: {device: cpu, set: {agent.type: adam, run.device: cpu, run.episodes: 160, log.eval_n: 100, log.probe_every: 20, log.probe_n: 8,
                         reward.c_fa: 3.0, reward.c_d: 1.0, reward.bonus: 6.0,
                         agent.batch: 128, agent.hidden: [24, 24], agent.adam.lr: 3.0e-4, agent.adam.huber_beta: 5.0, agent.adam.grad_clip: 10.0,
                         agent.tau: 0.005, agent.update_interval: 1, agent.buffer: 50000},
      axes: {loss: [{_name: huber, agent.adam.loss: huber}, {_name: mse, agent.adam.loss: mse}]}}
