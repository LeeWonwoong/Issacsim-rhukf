# 새 무대 · SWIRL R/N/pΔ(+q) 튜닝 1차 (c 0.6 · γ 0.97 고정, surrogate k-NN v1, 시드 42, GPU)
# 근거(newenv_regime s42): CP 설정(pΔ0.01·R1·q1e-3·N5·huber5)은 전 셀 loss↑·recall 0.02–0.23 (Adam 0.2–0.96),
#   K≈0.10 고정, SWIRL 최선 = c1·R0.5(c²/R 최대) → 이득 부족 가설: R↓·pΔ↑·q↑ 방향 탐색
base: [configs/newenv.yaml, configs/overlays/surrogate_knn.yaml]
outdir: results/claudecodefortest/newenv_swirl_tune
seeds: [42]
stages:
  a: {}
learners:
  sR:
    device: gpu
    set: {agent.type: swirl, run.device: cuda}
    axes: {agent.swirl.R: [0.25, 0.1]}
  sP:
    device: gpu
    set: {agent.type: swirl, run.device: cuda}
    axes: {agent.swirl.p_delta: [0.03, 0.1]}
  sQ:
    device: gpu
    set: {agent.type: swirl, run.device: cuda}
    axes: {agent.swirl.q: [1.0e-2, 1.0e-4]}
  sN:
    device: gpu
    set: {agent.type: swirl, run.device: cuda}
    axes: {agent.swirl.N: [2, 10]}
  sH:
    device: gpu
    set: {agent.type: swirl, run.device: cuda}
    axes: {agent.swirl.huber_c: [3.0]}
  sPR:
    device: gpu
    set: {agent.type: swirl, run.device: cuda}
    axes: {agent.swirl.p_delta: [0.03, 0.1], agent.swirl.R: [0.25]}
  sPRQ:
    device: gpu
    set: {agent.type: swirl, run.device: cuda, agent.swirl.q: 1.0e-2}
    axes: {agent.swirl.p_delta: [0.1], agent.swirl.R: [0.1]}
