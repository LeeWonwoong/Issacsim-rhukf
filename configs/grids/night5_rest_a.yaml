# night5_target_factorial.yaml 셋째 묶음 선행 분할본 (같은 outdir·이름 → 본 격자 작업자는 hist.json 보고 건너뜀)
base: [configs/newenv.yaml, configs/overlays/surrogate_knn.yaml]
outdir: results/claudecodefortest/night5
seeds: [42, 43, 44]
stages:
  a: {}
learners:
