# 09-22 23:25 ★실측 믿음 궤적 분석 결과 후보 전면 교체. Isaac 195에피에서 베이즈 믿음 p 를 복원해 보니
#  ★09-23 00:55 재기동: k-NN 을 KD-트리로 교체(풀 v2 에서 전수탐색 3.5 ms/스텝 → 0.03 ms, 120배). 이웃 거리 집합 동일(동점 처리만 다름) → 이전 브루트포스 결과와 짝비교 불가라 Adam 도 같이 재실행.
#  ★01:05 프로브 비용 제거: probe_every 5·probe_n 16 (훈련 1에피당 greedy 3.2에피 = 벽시계의 90%) → 20·8 (0.4에피). 훈련 결과에는 영향 없음(프로브는 별도 env·학습 없음).
#  ★01:30 범위 축소: 3시드 → 2시드(42·43). SWIRL 12런 / 6워커 = 2라운드. 3번째 시드는 승자 ρ 에만 나중에 붙인다. GPU 프로세스 8개에서 70 s/ep 로 급락(7개는 30) → n54 를 순차로 뺀다.
#   평시 중앙 0.004 / 공격 중 중앙 0.936 의 **포화 쌍봉**이라, 임계를 올려도 (a)지연 3.75→4.16 (b)유지 0.592→0.551 로 거의 안 변하고
#   (c)공격 종료 후 복귀지연 5.54→3.06 (−45%) (d)평시 오탐 0.0270→0.0159 (−41%) 가 크게 좋아진다.
#   ⇒ 사용자 요건(오탐↓·지연↓·공격중 유지·종료 후 빠른 복귀) 은 전부 **고-ρ(=C_FP/C_FN 큼)** 가 유리.
#     그리고 고-ρ 는 Isaac 에서 SWIRL 이 이긴 방향(v2 ρ2.33 +0.09 / v5 ρ1.0 동률 / v4 ρ0.67 −0.07)과 같다. 요건과 격차가 충돌하지 않는다.
#   β 축은 ρ2 고정 스윕에서 지연 4.11→3.95·오탐 0.0185→0.0204 로 거의 무반응 → 약한 노브. ρ 만 훑는다.
#   R 은 각 보상마다 2점(점유가중 s_dec 규칙의 권고 ±): v5 {0.35,0.5} · (1,2,1,6) {0.4,0.7} · (1,3,1,6) {0.5,0.9}
