# EKF-TD(IIR 공분산) 10시드 완성(45–51) + 축 B(바람 전환) EKF-TD 6시드 — SWIRL·Adam 과 같은 공유 노브
base: [configs/newenv_v2.yaml, configs/overlays/surrogate_knn.yaml]
outdir: results/claudecodefortest/ktd_v4
seeds: [45, 46, 47, 48, 49, 50, 51]
stages:
  a: {}
learners:
