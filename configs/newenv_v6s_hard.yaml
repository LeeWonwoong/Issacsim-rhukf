# configs/newenv_v6s_hard.yaml — 09-28 사용자: "바람 바뀌는 무대로 가되 전환 뒤 Adam 낙폭이 더 크게 드러나는 무대" 선별용 변형(모든 학습기 공통 무대).
#   대비 강화·강풍 지속: ep1–60 거의 무풍 U(0,2) → ep61–200 강풍 U(7,9) 유지 — 전환 폭 최대, 회복 구간 없음.
#   공격·보상(v5)·패턴은 v6 그대로, scenario.wind.schedule 만 바꿈(코드 수정 없음). 강풍 상한 9 = surrogate 풀·Isaac 생존 범위.
extends: newenv_v6.yaml
run: {name: newenv_v6s_hard}
scenario:
  wind:
    mode: uniform
    range: [0.0, 2.0]
    schedule:
      - {from_ep: 60, mode: uniform, range: [7.0, 9.0]}
