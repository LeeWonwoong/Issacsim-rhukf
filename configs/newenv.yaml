# configs/newenv.yaml — 새 무대 (2026-09-18 논의 확정안): 가치학습이 어려운 보상·공격 구조
#   · 공격 = 등급(약·전이·강) × 형태(burst·persistent). 초기 prefix 가 같아 t≈2–3 에서 관측이 겹치고 이후 갈라진다.
#     persistent 는 커지며(grow), 전이-persistent 는 치명대(≥0.78)까지 올라가 미대응 시 추락 = 결과성.
#   · 보상 = cost: 평시 hover −c_fa / 공격 track −c_d / 버스트 첫 hover +bonus / hover 유지 0, + alive(정책 불변, 추락 비용)
#   · 학습기 = CP 레짐(09-18 격자 교훈): γ0.97 · SWIRL error-state pΔ0.01 huber5 N5 q1e-3 R1 · 관측 [0,1] · 확약 없음
# surrogate 로 돌리면 풀 v5e(구 압축 풀, 정상상태 빈) — 과도 구간 충실도 한계. Isaac: --config configs/overlays/isaac.yaml 추가.
extends: base.yaml
run: {name: newenv, outdir: results/claudecodefortest/newenv/untitled}
scenario:
  attack:
    p_attack: 0.5
    family: profile
    start: [60, 200]
    events: [1, 3]           # 공격 에피소드당 사건 1–3 (사건마다 그룹 독립 추첨) — 09-18
    event_gap: [30, 60]      # 사건 끝 → 다음 온셋 (3–6 s)
    prefix: [0.3, 0.6, 0.9, 1.0]
    tail: [0.7, 0.35]
    classes:     # 등급 × 형태. prefix 공통(t0–t3) → burst 는 꼬리로 사그라들고 persistent 는 3–6 스텝에 걸쳐 커진다
      - {name: weak_burst,     weight: 0.175, delta: [0.10, 0.30], kind: burst,      dur: [3, 6]}
      - {name: weak_persist,   weight: 0.175, delta: [0.10, 0.30], kind: persistent, dur: [15, 30], grow: [1.8, 2.2], grow_steps: [3, 6]}
      - {name: trans_burst,    weight: 0.175, delta: [0.35, 0.60], kind: burst,      dur: [3, 6]}
      - {name: trans_persist,  weight: 0.175, delta: [0.35, 0.60], kind: persistent, dur: [15, 30], grow: [1.3, 1.5], grow_steps: [3, 6]}
      - {name: strong_burst,   weight: 0.15,  delta: [0.72, 0.84], kind: burst,      dur: [3, 6]}
      - {name: strong_persist, weight: 0.15,  delta: [0.72, 0.84], kind: persistent, dur: [25, 40]}
reward:              # 탐지기형 (09-18 확정): 오경보 · 지연 · 탐지 사건
  mode: cost
  scale: 0.6          # alive 0.5 → V ≈ 0.6·0.5/(1−0.97) = 10 (CP 레짐 O(10))
  alive: 0.5
  c_fa: 0.7           # 평시 hover (오경보)
  c_d: 0.3            # 공격 중 track, 스텝마다 상수 → 누적 = c_d × 탐지 지연
  bonus: 2.0          # 사건마다 첫 hover 1회 (burst 도 공격 — 잡는다). 2 = 공격 끝 뒤 ≤4 스텝 안에 풀면 burst 탐지가 이득(잡고 빨리 풀기)
  terminal_penalty: 0.0
agent:
  gamma: 0.97
  swirl: {form: error, p_delta: 0.01, huber_c: 5.0, N: 5, R: 1.0, q: 1.0e-3, alpha: 0.1}
